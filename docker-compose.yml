services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: adfusion
      POSTGRES_USER: adfusion
      POSTGRES_PASSWORD: adfusion
    ports:
      - "5432:5432"
    volumes:
      - adfusion_postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  adfusion_postgres:
